<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}推し活遠征管理{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 28px; }
    form.panel, .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 16px;
      margin-bottom: 16px;
    }
    form.panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label { font-size: 0.85rem; color: #555; }
    input, textarea {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    button, .btn {
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #ff6f91;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      box-sizing: border-box;
    }
    .btn.secondary {
      background: #eee;
      color: #333;
    }
    .trip {
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .trip-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .trip-info .event { font-weight: bold; display: block; }
    .trip-budget { font-weight: bold; color: #ff6f91; display: block; text-align: right; white-space: nowrap; }
    .days-left { font-size: 0.8rem; color: #ff6f91; font-weight: bold; }
    .trip-actions { display: flex; gap: 12px; margin-top: 8px; }
    .trip-actions form { display: inline; }
    .trip-actions button, .trip-actions a {
      background: none;
      border: none;
      color: #999;
      font-size: 0.8rem;
      padding: 4px 0;
      text-decoration: underline;
      cursor: pointer;
    }
    .trip-photo {
      width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .trip-route, .trip-memo {
      font-size: 0.85rem;
      color: #444;
      margin-top: 6px;
      white-space: pre-wrap;
    }
    .trip-route .label, .trip-memo .label {
      font-size: 0.75rem;
      color: #999;
      display: block;
    }
    .total { text-align: right; font-size: 1rem; font-weight: bold; margin: 8px 0 16px; }
    .empty { color: #999; text-align: center; padding: 20px 0; }
    .share-panel { font-size: 0.85rem; }
    .share-url {
      word-break: break-all;
      background: #f4f4f4;
      padding: 8px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 0.8rem;
    }
    .share-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .share-actions form { flex: 1; }
    .share-actions button { width: 100%; }
    .banner {
      background: #fff3cd;
      color: #806400;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
    .photo-preview-block { margin-bottom: 4px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; }
    .checkbox-label input { width: auto; }
  </style>
</head>
<body>
  <h1>{% block heading %}推し活遠征管理{% endblock %}</h1>
  {% block content %}{% endblock %}
</body>
</html>
